name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      matrix:
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - name: Compile app
        shell: bash
        run: |
          source scripts/toolchain.sh
          xcrun swift build --sdk "$SDKROOT" --configuration "${{ matrix.configuration }}"
      - name: Check metadata and shell scripts
        run: |
          plutil -lint Resources/Info.plist
          for script in scripts/*.sh; do
            case "$script" in
              scripts/test.sh|scripts/toolchain.sh) zsh -n "$script" ;;
              *) bash -n "$script" ;;
            esac
          done

  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift Testing suite
        run: ./scripts/test.sh

  format:
    name: Check formatting
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift formatting
        run: ./scripts/format.sh
