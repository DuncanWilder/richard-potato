name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (release)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Compile app
        shell: bash
        run: |
          source scripts/toolchain.sh
          xcrun swift build --sdk "$SDKROOT" --configuration release
      - name: Check metadata and shell scripts
        run: |
          plutil -lint Resources/Info.plist
          for script in scripts/*.sh; do
            case "$script" in
              scripts/test.sh|scripts/toolchain.sh) zsh -n "$script" ;;
              *) bash -n "$script" ;;
            esac
          done

  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Run Swift Testing suite
        run: ./scripts/test.sh --configuration release

  format:
    name: Check formatting
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Check Swift formatting
        run: ./scripts/format.sh

  release-smoke:
    name: Release script smoke test
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full release history
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - name: Test release planning fixtures
        run: python3 scripts/test-release-plan.py
      - name: Test release clean-tree regression
        run: python3 scripts/test-release-clean-tree.py
      - name: Exercise publish planning with system Bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /bin/bash scripts/github-release.sh --plan-only
      - name: Build, sign and zip with system Bash
        run: /bin/bash scripts/github-release.sh --dry-run
